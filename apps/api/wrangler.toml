#:schema https://raw.githubusercontent.com/cloudflare/workers-sdk/main/packages/wrangler/config-schema.json
name = "tenex-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Observability
[observability]
enabled = true

# Local dev defaults to .dev.vars for secrets
# Production secrets: `bun --filter @app/api run secrets:put` after authoring .dev.vars

[vars]
ENVIRONMENT = "production"

# Ingestion bindings. IDs are placeholders — run:
#   bunx wrangler d1 create tenex
#   bunx wrangler kv namespace create CACHE
#   bunx wrangler r2 bucket create tenex
# and paste the returned IDs in.

[[d1_databases]]
binding = "DB"
database_name = "tenex"
database_id = "85cbeea4-aa87-48e1-a753-d6469ef3eb88"

[[kv_namespaces]]
binding = "CACHE"
id = "78e3c691a0dd42e8a304a80b26168f55"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "tenex"

# Vectorize index backing semantic chat search for both `searchWiki`
# and `searchSources`. Provision once on the account with:
#   bunx wrangler vectorize create tenex-sources --dimensions=1536 --metric=cosine
# Dimensionality matches OpenAI `text-embedding-3-small`; metric is
# cosine. If unavailable, chat uses D1/R2 keyword-overlap search.
# See packages/domains/chat/glossary.md.
[[vectorize]]
binding = "VECTORIZE"
index_name = "tenex-sources"

# CompileRunDO orchestrates the multi-minute Compile so it can outlive the
# 30s Workers request limit. Per spec §3.1.
[[durable_objects.bindings]]
name = "COMPILE_RUN"
class_name = "CompileRunDO"

# ChatTurnDO hosts one chat turn's research + synth loop so chat.ask
# (writes to tape) and chat.streamAnswer (subscribes to tape) share a
# single addressable instance, regardless of which Worker isolate each
# request lands in. Without this, the in-memory dispatcher's Map silently
# desyncs across isolates and SSE hangs.
[[durable_objects.bindings]]
name = "CHAT_TURN"
class_name = "ChatTurnDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CompileRunDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ChatTurnDO"]

[env.dev]
[env.dev.vars]
ENVIRONMENT = "development"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "tenex"
database_id = "85cbeea4-aa87-48e1-a753-d6469ef3eb88"

[[env.dev.kv_namespaces]]
binding = "CACHE"
id = "78e3c691a0dd42e8a304a80b26168f55"

[[env.dev.r2_buckets]]
binding = "STORAGE"
bucket_name = "tenex"

[[env.dev.vectorize]]
binding = "VECTORIZE"
index_name = "tenex-sources"

[[env.dev.durable_objects.bindings]]
name = "COMPILE_RUN"
class_name = "CompileRunDO"

[[env.dev.durable_objects.bindings]]
name = "CHAT_TURN"
class_name = "ChatTurnDO"

# Production: same Worker serves /rpc/* (api) and apps/web/dist (SPA).
# Per ADR-0002. Scoped to env.prod so `wrangler dev` (top-level config)
# never touches the assets dir, which may not exist locally.
[env.prod]
name = "tenex-api"

[env.prod.vars]
ENVIRONMENT = "production"
# Google OAuth callback URL the api advertises to Google. Must match an
# entry in the OAuth client's "Authorized redirect URIs" list in Google
# Cloud Console. Non-secret — the same value is visible to anyone who
# starts the OAuth flow — so it lives here, not in Worker secrets.
GOOGLE_OAUTH_REDIRECT = "https://tenex-api.tonyvantur.workers.dev/rpc/ingestion/authCallback"
# Comma-separated list of origins the OAuth callback can 302 back to.
# Protects against open-redirect from a tampered `returnTo`.
WEB_APP_ORIGINS = "https://tenex-api.tonyvantur.workers.dev"

[env.prod.observability]
enabled = true

[[env.prod.durable_objects.bindings]]
name = "COMPILE_RUN"
class_name = "CompileRunDO"

[[env.prod.durable_objects.bindings]]
name = "CHAT_TURN"
class_name = "ChatTurnDO"

[env.prod.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# All Worker-handled paths must be listed here — anything else falls
# through to the static asset handler (and ultimately to the SPA
# fallback). `/__source/*` serves extracted PDF text + raw bytes for
# the citation modal; `/__dev/*` hosts the rehash + future ops
# endpoints; `/__seed/*` is left in for ad-hoc fixture seeding.
run_worker_first = ["/rpc/*", "/__source/*", "/__dev/*", "/__seed/*", "/__admin/*"]

[[env.prod.d1_databases]]
binding = "DB"
database_name = "tenex"
database_id = "85cbeea4-aa87-48e1-a753-d6469ef3eb88"

[[env.prod.kv_namespaces]]
binding = "CACHE"
id = "78e3c691a0dd42e8a304a80b26168f55"

[[env.prod.r2_buckets]]
binding = "STORAGE"
bucket_name = "tenex"

[[env.prod.vectorize]]
binding = "VECTORIZE"
index_name = "tenex-sources"
