#:schema https://raw.githubusercontent.com/cloudflare/workers-sdk/main/packages/wrangler/config-schema.json
name = "tenex-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Observability
[observability]
enabled = true

# Local dev defaults to .dev.vars for secrets
# Production secrets: `bun --filter @app/api run secrets:put` after authoring .dev.vars

[vars]
ENVIRONMENT = "production"

# Ingestion bindings. IDs are placeholders — run:
#   bunx wrangler d1 create tenex
#   bunx wrangler kv namespace create CACHE
#   bunx wrangler r2 bucket create tenex
# and paste the returned IDs in.

[[d1_databases]]
binding = "DB"
database_name = "tenex"
database_id = "85cbeea4-aa87-48e1-a753-d6469ef3eb88"

[[kv_namespaces]]
binding = "CACHE"
id = "78e3c691a0dd42e8a304a80b26168f55"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "tenex"

# CompileRunDO orchestrates the multi-minute Compile so it can outlive the
# 30s Workers request limit. Per spec §3.1.
[[durable_objects.bindings]]
name = "COMPILE_RUN"
class_name = "CompileRunDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CompileRunDO"]

[env.dev]
[env.dev.vars]
ENVIRONMENT = "development"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "tenex"
database_id = "85cbeea4-aa87-48e1-a753-d6469ef3eb88"

[[env.dev.kv_namespaces]]
binding = "CACHE"
id = "78e3c691a0dd42e8a304a80b26168f55"

[[env.dev.r2_buckets]]
binding = "STORAGE"
bucket_name = "tenex"

[[env.dev.durable_objects.bindings]]
name = "COMPILE_RUN"
class_name = "CompileRunDO"

# Production: same Worker serves /rpc/* (api) and apps/web/dist (SPA).
# Per ADR-0002. Scoped to env.prod so `wrangler dev` (top-level config)
# never touches the assets dir, which may not exist locally.
[env.prod]
name = "tenex-api"

[env.prod.vars]
ENVIRONMENT = "production"
# Google OAuth callback URL the api advertises to Google. Must match an
# entry in the OAuth client's "Authorized redirect URIs" list in Google
# Cloud Console. Non-secret — the same value is visible to anyone who
# starts the OAuth flow — so it lives here, not in Worker secrets.
GOOGLE_OAUTH_REDIRECT = "https://tenex-api.tonyvantur.workers.dev/rpc/ingestion/authCallback"
# Comma-separated list of origins the OAuth callback can 302 back to.
# Protects against open-redirect from a tampered `returnTo`.
WEB_APP_ORIGINS = "https://tenex-api.tonyvantur.workers.dev"

[env.prod.observability]
enabled = true

[[env.prod.durable_objects.bindings]]
name = "COMPILE_RUN"
class_name = "CompileRunDO"

[env.prod.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/rpc/*"]

[[env.prod.d1_databases]]
binding = "DB"
database_name = "tenex"
database_id = "85cbeea4-aa87-48e1-a753-d6469ef3eb88"

[[env.prod.kv_namespaces]]
binding = "CACHE"
id = "78e3c691a0dd42e8a304a80b26168f55"

[[env.prod.r2_buckets]]
binding = "STORAGE"
bucket_name = "tenex"
