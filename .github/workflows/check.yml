name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · spell · typecheck · test · rulesync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies (runs rulesync generate via postinstall)
        # simple-git-hooks@2.13.1's own postinstall walks the wrong dir under
        # bun 1.3.x's isolated install layout (looks for package.json at
        # node_modules/.bun/simple-git-hooks@.../package.json, which bun puts
        # one level deeper). The repo's own postinstall (`bunx simple-git-hooks`)
        # runs separately and is for local pre-commit hooks — irrelevant on CI.
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
        run: bun install --frozen-lockfile

      - name: Check (lint · spell · typecheck · test)
        run: bun run check

  e2e:
    name: playwright (live deploy smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The smoke runs against the live Workers deploy. On pull_request the
    # PR's code isn't deployed yet, so we'd be testing stale state — run only
    # on push-to-main (post-merge) and on manual dispatch (post-deploy
    # verification). PRs gate on the unit/typecheck/lint job above.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      # Runs against the live Worker deploy — no local server needed. If you
      # want to point this at a preview URL, set PLAYWRIGHT_BASE_URL on the job.
      - name: Run Playwright tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
