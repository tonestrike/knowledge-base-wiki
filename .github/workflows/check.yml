name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · spell · typecheck · test · rulesync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (lint · spell · typecheck · test)
        run: bun run check

      - name: Rulesync drift gate
        run: |
          bun run rulesync
          if ! git diff --exit-code; then
            echo ""
            echo "ERROR: rulesync drift detected."
            echo "The following generated files differ from what .rulesync/ sources produce:"
            git diff --name-only
            echo ""
            echo "Fix: run 'bun run rulesync' locally and commit the result."
            exit 1
          fi
