name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · spell · typecheck · test · rulesync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies (runs rulesync generate via postinstall)
        # simple-git-hooks@2.13.1's own postinstall walks the wrong dir under
        # bun 1.3.x's isolated install layout (looks for package.json at
        # node_modules/.bun/simple-git-hooks@.../package.json, which bun puts
        # one level deeper). The repo's own postinstall (`bunx simple-git-hooks`)
        # runs separately and is for local pre-commit hooks — irrelevant on CI.
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
        run: bun install --frozen-lockfile

      - name: Check (lint · spell · typecheck · test)
        run: bun run check
